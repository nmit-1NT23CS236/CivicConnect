
{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <div class="auth-card register-card">

        <div class="auth-icon">🏛️</div>
        <h2>Create Account</h2>
        <p class="auth-subtitle">
            Join CivicConnect and make your community better.
        </p>

        <form method="POST" action="{{ url_for('register') }}"
              onsubmit="return validateRegistration()">

            <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" id="name" name="name"
                       class="form-control"
                       placeholder="Enter your full name"
                       minlength="2" maxlength="100"
                       autocomplete="name" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" name="email"
                       class="form-control"
                       placeholder="Enter your email"
                       autocomplete="email" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>

                <div class="password-wrapper">
                    <input type="password" id="password" name="password"
                           class="form-control"
                           placeholder="Create a password"
                           minlength="8"
                           autocomplete="new-password" required>

                    <button type="button" class="password-toggle"
                            onclick="toggleField('password', this)"
                            aria-label="Show password">👁️</button>
                </div>

                <div class="password-strength">
                    <div id="strengthBar"></div>
                </div>
                <small id="strengthText" class="text-muted">
                    Use at least 8 characters.
                </small>
            </div>

            <div class="mb-3">
                <label for="confirmPassword" class="form-label">
                    Confirm Password
                </label>

                <div class="password-wrapper">
                    <input type="password" id="confirmPassword"
                           name="confirmPassword"
                           class="form-control"
                           placeholder="Re-enter your password"
                           autocomplete="new-password" required>

                    <button type="button" class="password-toggle"
                            onclick="toggleField('confirmPassword', this)"
                            aria-label="Show password">👁️</button>
                </div>

                <small id="matchMessage"></small>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Create My Account →
            </button>

        </form>

        <div class="auth-footer">
            Already have an account?
            <a href="{{ url_for('login') }}">Login here</a>
        </div>

        <p class="register-note">
            🔒 Your account credentials are protected.
        </p>
    </div>
</div>

<script>
function toggleField(fieldId, button) {
    const field = document.getElementById(fieldId);

    if (field.type === "password") {
        field.type = "text";
        button.textContent = "🙈";
        button.setAttribute("aria-label", "Hide password");
    } else {
        field.type = "password";
        button.textContent = "👁️";
        button.setAttribute("aria-label", "Show password");
    }
}

const password = document.getElementById("password");
const confirmPassword = document.getElementById("confirmPassword");
const strengthBar = document.getElementById("strengthBar");
const strengthText = document.getElementById("strengthText");
const matchMessage = document.getElementById("matchMessage");

password.addEventListener("input", function () {
    const value = password.value;
    let score = 0;

    if (value.length >= 8) score++;
    if (/[A-Z]/.test(value)) score++;
    if (/[a-z]/.test(value)) score++;
    if (/[0-9]/.test(value)) score++;
    if (/[^A-Za-z0-9]/.test(value)) score++;

    const labels = ["Very weak", "Weak", "Fair", "Good", "Strong"];
    strengthBar.style.width = (score * 20) + "%";
    strengthBar.className = "strength-level strength-" + score;
    strengthText.textContent = value.length === 0
        ? "Use at least 8 characters."
        : labels[Math.max(0, score - 1)];

    checkMatch();
});

confirmPassword.addEventListener("input", checkMatch);

function checkMatch() {
    if (!confirmPassword.value) {
        matchMessage.textContent = "";
        return;
    }

    const matches = password.value === confirmPassword.value;
    matchMessage.textContent = matches
        ? "✓ Passwords match"
        : "✗ Passwords do not match";

    matchMessage.style.color = matches ? "green" : "red";
}

function validateRegistration() {
    if (password.value.length < 8) {
        alert("Password must contain at least 8 characters.");
        return false;
    }

    if (password.value !== confirmPassword.value) {
        alert("Passwords do not match!");
        return false;
    }

    return true;
}
</script>
{% endblock %}
